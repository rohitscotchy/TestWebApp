name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]


jobs:

  # ============================================================
  # CI - Run tests against PostgreSQL
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine

        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb

        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

        ports:
          - 5432:5432

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirement.txt

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement.txt
          python -m pip install pytest-cov

      # --------------------------------------------------------
      # Run tests + coverage
      # --------------------------------------------------------
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb

        run: |
          python -m pytest test/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term \
            --cov-report=xml

      # --------------------------------------------------------
      # Upload coverage report as GitHub Actions artifact
      # --------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ============================================================
  # CD - Build Docker Image
  # ============================================================
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    # Build only for push events.
    # Pull requests will only execute the test job.
    if: github.event_name == 'push'

    steps:

      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t testwbapp:${{ github.sha }} \
            .

      # --------------------------------------------------------
      # Verify Docker image
      # --------------------------------------------------------
      - name: Verify Docker image
        run: |
          docker image ls
          docker inspect testwbapp:${{ github.sha }}


  # ============================================================
  # CD - Deploy to Render
  # ============================================================
  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest

    # Deploy ONLY when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------------
      # Trigger Render deployment
      # --------------------------------------------------------
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

        run: |
          curl --fail --show-error --silent \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

      # --------------------------------------------------------
      # Deployment successful
      # --------------------------------------------------------
      - name: Deployment successful
        if: success()
        run: |
          echo "Deployment to Render triggered successfully."

      # --------------------------------------------------------
      # Deployment failed
      # --------------------------------------------------------
      - name: Deployment failed
        if: failure()
        run: |
          echo "Deployment failed. Check the Render dashboard."